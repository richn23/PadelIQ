ription:"Reliable in matches: wins points on purpose, handles pressure.",coachFocus:"Build points on purpose: use depth, pace and height to move opponents, then finish when the ball is there.",coachFocusSource:"draft"},{id:"A",order:4,name:"A",assessable:!0,description:"Complete player: varied shots, smart tactics, and stays strong against good opponents.",coachFocus:"Control the match: vary spin and pace, read the opponents and change the plan when needed.",coachFocusSource:"draft"},{id:"Pro",order:5,name:"Pro",assessable:!1,description:"Professional level. The top benchmark, not an assessment target for most players.",coachFocus:"Coming soon.",coachFocusSource:"draft"}],$f={statementCheck:{goodEnough:["always","usually"],mastered:["always"],share:.75}},eh=[{id:"serve",axis:"attack",name:"Serve",levels:{beginner:{master:!0,source:"richard",text:"Learning the serve. Often faults. Just trying to get it in the box."},D:{master:!0,source:"richard",text:"In the right box about 7 or 8 out of 10. Soft and floaty. Not deep, no slice, no aiming at the side glass. The goal is just getting it in."},C:{master:!0,source:"draft",text:"Usually in, with some depth. Can aim to a side or the body. Less reliable under pressure."},B:{master:!0,source:"draft",text:"Reliable first serve with pace or slice. Placement is chosen on purpose and holds up when the score is tight."},A:{master:!0,source:"draft",text:"Varies pace, spin and direction to set up the next shot. Targets weaknesses on purpose."}},statements:[{id:"serve_1",level:"beginner",text:"I know how to serve: bounce, hit below the waist, diagonally into the box.",source:"draft"},{id:"serve_2",level:"D",text:"My serve goes in.",source:"draft"},{id:"serve_3",level:"C",text:"I can serve deep, close to the back glass.",source:"draft"},{id:"serve_4",level:"C",text:"I can aim my serve at the side glass or the body.",source:"draft"},{id:"serve_5",level:"B",text:"My first serve rarely misses, even at tight scores.",source:"draft"},{id:"serve_6",level:"B",text:"I can add pace without missing.",source:"draft"},{id:"serve_7",level:"B",text:"I can slice it so it stays low off the glass.",source:"draft"},{id:"serve_8",level:"A",text:"I choose the serve to suit the returner.",source:"draft"},{id:"serve_9",level:"A",text:"I mix pace, spin and direction so the returner can't settle.",source:"draft"}],warnings:[{id:"serve_w1",level:"D",text:"Do you fault more serves than you get in?",source:"draft",fix:"Get more first serves in"},{id:"serve_w2",level:"C",text:"Do you double fault in most games?",source:"draft",fix:"Cut out double faults"},{id:"serve_w3",level:"B",text:"Does your serve go short and easy to attack when the score is tight?",source:"draft",fix:"Keep my serve deep at tight scores"}]},{id:"overhead_basic",axis:"attack",name:"Basic overhead",levels:{D:{master:!0,source:"draft",text:"Gets some easy lobs back with an overhead, mostly pushing the ball rather than hitting through it."},C:{master:!0,source:"draft",text:"Gets under most lobs and hits a controlled overhead back, usually deep."}},statements:[{id:"overhead_basic_1",level:"D",text:"I can get under easy lobs.",source:"draft"},{id:"overhead_basic_2",level:"D",text:"I can hit an overhead back over the net.",source:"draft"},{id:"overhead_basic_3",level:"C",text:"My overhead goes back deep and controlled.",source:"draft"},{id:"overhead_basic_4",level:"C",text:"I turn sideways and move back for lobs.",source:"draft"}],warnings:[{id:"overhead_basic_w1",level:"D",text:"Do you let lobs go because you can't hit them?",source:"draft",fix:"Go for lobs instead of letting them go"},{id:"overhead_basic_w2",level:"C",text:"Do your overheads land short and get attacked?",source:"draft",fix:"Hit my overheads deeper"}]},{id:"bandeja",axis:"attack",name:"Bandeja",levels:{C:{master:!0,source:"draft",text:"Can hit a bandeja in a friendly game to hold the net. Depth and direction vary."},B:{master:!0,source:"draft",text:"Reliable bandeja that keeps opponents back and holds the net, even when rushed."},A:{master:!0,source:"draft",text:"Chooses between attacking and defensive bandeja depending on the situation."}},statements:[{id:"bandeja_1",level:"C",text:"I can hit a bandeja in a friendly game.",source:"draft"},{id:"bandeja_2",level:"C",text:"After my bandeja, I stay at the net.",source:"draft"},{id:"bandeja_3",level:"B",text:"My bandeja lands deep, so opponents stay back.",source:"draft"},{id:"bandeja_4",level:"B",text:"I can hit it when I'm rushed or moving back.",source:"draft"},{id:"bandeja_5",level:"B",text:"I can choose cross-court or straight.",source:"draft"},{id:"bandeja_6",level:"A",text:"I choose an attacking or a defensive bandeja depending on the ball.",source:"draft"},{id:"bandeja_7",level:"A",text:"I control slice and pace so it stays low off the glass.",source:"draft"}],warnings:[{id:"bandeja_w1",level:"C",text:"Do you lose the net after your bandeja?",source:"draft",fix:"Stay at the net after my bandeja"},{id:"bandeja_w2",level:"B",text:"Does your bandeja land short or in the middle when you're rushed?",source:"draft",fix:"Keep my bandeja deep when I'm rushed"}]},{id:"vibora",axis:"attack",name:"Víbora",levels:{B:{master:!0,source:"draft",text:"Can use a víbora to add pace and angle when the ball is right for it."},A:{master:!0,source:"draft",text:"Chooses víbora versus bandeja on purpose and places it under pressure."}},statements:[{id:"vibora_1",level:"B",text:"I can hit a víbora with side spin.",source:"draft"},{id:"vibora_2",level:"B",text:"My víbora lands low into the side glass.",source:"draft"},{id:"vibora_3",level:"A",text:"I choose víbora or bandeja depending on the lob.",source:"draft"},{id:"vibora_4",level:"A",text:"I hit it hard without losing control, even under pressure.",source:"draft"}],warnings:[{id:"vibora_w1",level:"B",text:"Does your víbora go long or into the net?",source:"draft",fix:"Keep my víbora in"}]},{id:"bajada",axis:"attack",name:"Bajada",levels:{B:{master:!0,source:"draft",text:"Can attack a ball coming off the back glass with control."},A:{master:!0,source:"draft",text:"Uses the bajada to finish points with placement and power."}},statements:[{id:"bajada_1",level:"B",text:"I attack balls that come off the back glass high.",source:"draft"},{id:"bajada_2",level:"B",text:"I wait for the right height before hitting.",source:"draft"},{id:"bajada_3",level:"A",text:"I place my bajada low, to the feet or down the middle.",source:"draft"},{id:"bajada_4",level:"A",text:"I use the bajada to win the net back.",source:"draft"}],warnings:[{id:"bajada_w1",level:"B",text:"Do you hit balls off the back glass too early or too late to attack them?",source:"draft",fix:"Wait for the right height before my bajada"}]},{id:"return_of_serve",axis:"defence",name:"Return of serve",levels:{beginner:{master:!0,source:"richard",text:"Gets some serves back, but often misses or hits it out."},D:{master:!0,source:"richard",text:"Gets the ball over the net. Soft and floaty. Backhand is weaker."},C:{master:!0,source:"draft",text:"Usually a safe, deep return. Backhand is steadier. Starts choosing direction."},B:{master:!0,source:"draft",text:"Reliable return under pressure. Can choose a low, a lob or an attacking return."},A:{master:!0,source:"draft",text:"Returns on purpose to win the net and hurts weak serves."}},statements:[{id:"return_of_serve_1",level:"beginner",text:"I know where to stand to return.",source:"draft"},{id:"return_of_serve_2",level:"D",text:"I get most serves back.",source:"draft"},{id:"return_of_serve_3",level:"C",text:"My return goes low or to the middle.",source:"draft"},{id:"return_of_serve_4",level:"C",text:"I can return serves that come off the side glass.",source:"draft"},{id:"return_of_serve_5",level:"B",text:"I aim my return on purpose: low cross-court, middle or lob.",source:"draft"},{id:"return_of_serve_6",level:"B",text:"I return well, even at tight scores.",source:"draft"},{id:"return_of_serve_7",level:"A",text:"I choose the return to suit the server and their partner.",source:"draft"},{id:"return_of_serve_8",level:"A",text:"My return puts us on the attack.",source:"draft"}],warnings:[{id:"return_of_serve_w1",level:"D",text:"Do you miss more returns than you get back?",source:"draft",fix:"Get more returns back"},{id:"return_of_serve_w2",level:"C",text:"Do your returns sit up for the net players?",source:"draft",fix:"Keep my returns low"},{id:"return_of_serve_w3",level:"B",text:"Do you miss returns at tight scores?",source:"draft",fix:"Get my returns in at tight scores"}]},{id:"defensive_lob",axis:"defence",name:"Defensive lob",levels:{D:{master:!0,source:"draft",text:"Can get the lob over the net sometimes, but it's often too low or too short. Only works in an easy rally with plenty of time."},C:{master:!0,source:"draft",text:"Usually gets a lob over in a friendly game when there is time. Height and depth are hit or miss. Falls apart when rushed or off the glass."},B:{master:!0,source:"draft",text:"Usually lands a deep lob in matches, even when rushed. Pushes opponents back and lets you win the net. Mostly holds when the score is tight."},A:{master:!0,source:"draft",text:"Chooses the lob on purpose: side, height, depth. Works from awkward positions and at big points against strong opponents."}},statements:[{id:"defensive_lob_1",level:"D",text:"I can lob the ball over the net players.",source:"draft"},{id:"defensive_lob_2",level:"C",text:"My lob goes high and deep, not short.",source:"draft"},{id:"defensive_lob_3",level:"C",text:"After a good lob, I move up to the net.",source:"draft"},{id:"defensive_lob_4",level:"B",text:"I can lob from difficult spots, like off the glass or from the corner.",source:"draft"},{id:"defensive_lob_5",level:"B",text:"I aim my lob over the weaker overhead player, or down the middle.",source:"draft"},{id:"defensive_lob_6",level:"A",text:"I lob on purpose to win the net back, even under pressure.",source:"draft"}],warnings:[{id:"defensive_lob_w1",level:"D",text:"Do your lobs land short in the middle of the court?",source:"draft",fix:"Lob higher and deeper"},{id:"defensive_lob_w2",level:"C",text:"Do your lobs go long or out over the glass?",source:"draft",fix:"Keep my lobs in"},{id:"defensive_lob_w3",level:"B",text:"Do your lobs get smashed back at you?",source:"draft",fix:"Lob deep enough that it can't be smashed"}]},{id:"back_glass_return",axis:"defence",name:"Back glass return",levels:{D:{master:!0,source:"richard",text:"Rarely plays off the glass, and often doesn't succeed when it does."},C:{master:!0,source:"draft",text:"Can return most slow or medium balls off the back glass. Struggles with fast or awkward rebounds."},B:{master:!0,source:"draft",text:"Reads rebounds early and returns most balls off the back glass with control."},A:{master:!0,source:"draft",text:"Uses the glass to buy time and turn defence into attack."}},statements:[{id:"back_glass_return_1",level:"D",text:"I let some balls hit the back glass before I play them.",source:"draft"},{id:"back_glass_return_2",level:"D",text:"I get easy rebounds back over the net.",source:"draft"},{id:"back_glass_return_3",level:"C",text:"I return most slow and medium rebounds.",source:"draft"},{id:"back_glass_return_4",level:"C",text:"I stand at the right distance from the glass.",source:"draft"},{id:"back_glass_return_5",level:"B",text:"I read fast rebounds early and return them with control.",source:"draft"},{id:"back_glass_return_6",level:"B",text:"After the glass, I can choose a lob or a low ball.",source:"draft"},{id:"back_glass_return_7",level:"A",text:"I use the glass to buy time and turn defence into attack.",source:"draft"}],warnings:[{id:"back_glass_return_w1",level:"D",text:"Do you hit the ball before the glass because you're unsure of the rebound?",source:"draft",fix:"Let the ball come off the back glass"},{id:"back_glass_return_w2",level:"C",text:"Do you stand too close to the glass and get cramped?",source:"draft",fix:"Give myself room from the glass"},{id:"back_glass_return_w3",level:"B",text:"Do fast rebounds off the back glass beat you?",source:"draft",fix:"Read fast rebounds earlier"}]},{id:"side_glass_return",axis:"defence",name:"Side glass return",levels:{C:{master:!0,source:"draft",text:"Can return simple balls off the side glass. Often late on faster ones."},B:{master:!0,source:"draft",text:"Reads side-glass angles and returns with control most of the time."},A:{master:!0,source:"draft",text:"Handles fast and awkward side glass angles under pressure, and places the return."}},statements:[{id:"side_glass_return_1",level:"C",text:"I return simple balls off the side glass.",source:"draft"},{id:"side_glass_return_2",level:"B",text:"I read the angle off the side glass early.",source:"draft"},{id:"side_glass_return_3",level:"B",text:"I return side glass balls with control most of the time.",source:"draft"},{id:"side_glass_return_4",level:"A",text:"I handle fast, awkward side glass balls under pressure, and place the return.",source:"draft"}],warnings:[{id:"side_glass_return_w1",level:"C",text:"Do side glass balls get past you?",source:"draft",fix:"Get side glass balls back"},{id:"side_glass_return_w2",level:"B",text:"Are you late on fast balls off the side glass?",source:"draft",fix:"Be early on fast side glass balls"}]},{id:"ready_position",axis:"movement",name:"Ready position and split step",levels:{D:{master:!0,source:"draft",text:"Knows the ready position and uses it on slow balls, but is often late on fast ones."},C:{master:!0,source:"draft",text:"Usually ready before the opponent hits. Split step is inconsistent."}},statements:[{id:"ready_position_1",level:"D",text:"I stand in a ready position between shots.",source:"draft"},{id:"ready_position_2",level:"D",text:"I'm ready before slow balls arrive.",source:"draft"},{id:"ready_position_3",level:"C",text:"I'm ready before the opponent hits.",source:"draft"},{id:"ready_position_4",level:"C",text:"I do a small split step as they hit.",source:"draft"}],warnings:[{id:"ready_position_w1",level:"D",text:"Do fast balls catch you flat-footed?",source:"draft",fix:"Be ready for fast balls"},{id:"ready_position_w2",level:"C",text:"Are you still moving when the opponent hits?",source:"draft",fix:"Be still and ready when they hit"}]},{id:"net_play",axis:"movement",name:"Taking and holding the net",levels:{D:{master:!0,source:"richard",text:"Nothing consistent yet. Sometimes ends up at the net at the wrong time, or stays at the net all the time. Volleys are often a block that goes into the net or too high."},C:{master:!0,source:"draft",text:"Takes the net when the chance is clear and holds it with steady volleys."},B:{master:!0,source:"draft",text:"Wins and holds the net on purpose. Volleys have direction, attacking or defensive as needed."},A:{master:!0,source:"draft",text:"Dominates the net. Redirects, finishes and recovers position quickly."}},statements:[{id:"net_play_1",level:"D",text:"I sometimes play at the net.",source:"draft"},{id:"net_play_2",level:"C",text:"I take the net when the chance is clear.",source:"draft"},{id:"net_play_3",level:"C",text:"Once I'm there, I stay with steady volleys.",source:"draft"},{id:"net_play_4",level:"C",text:"I leave the net when we're in trouble, instead of staying there.",source:"draft"},{id:"net_play_5",level:"B",text:"I win the net back on purpose, for example after a good lob.",source:"draft"},{id:"net_play_6",level:"B",text:"I hold the net under pressure.",source:"draft"},{id:"net_play_7",level:"A",text:"We control most points from the net.",source:"draft"},{id:"net_play_8",level:"A",text:"I get back into my net position quickly after each shot.",source:"draft"}],warnings:[{id:"net_play_w1",level:"D",text:"Do you end up at the net at the wrong time, or stay there when you're in trouble?",source:"draft",fix:"Go to the net at the right time, and leave it when we're in trouble"},{id:"net_play_w2",level:"C",text:"Do you lose the net after one lob?",source:"draft",fix:"Win the net back after a lob"},{id:"net_play_w3",level:"B",text:"Do opponents get you off the net easily?",source:"draft",fix:"Hold the net under pressure"}]},{id:"recovery",axis:"movement",name:"Recovery",levels:{C:{master:!0,source:"draft",text:"Sometimes gets back into position after a shot. Often caught out of place."},B:{master:!0,source:"draft",text:"Usually recovers to a good position before the next ball."},A:{master:!0,source:"draft",text:"Recovers automatically, even after being pulled wide."}},statements:[{id:"recovery_1",level:"C",text:"After each shot, I move back into position.",source:"draft"},{id:"recovery_2",level:"B",text:"I recover quickly after being pulled wide.",source:"draft"},{id:"recovery_3",level:"B",text:"I move straight after hitting, instead of watching my shot.",source:"draft"},{id:"recovery_4",level:"A",text:"I'm balanced and ready for the next ball, even in long rallies.",source:"draft"}],warnings:[{id:"recovery_w1",level:"C",text:"Do you stand and watch your shot instead of moving?",source:"draft",fix:"Move straight after my shot"},{id:"recovery_w2",level:"B",text:"After being pulled wide, are you out of position for the next ball?",source:"draft",fix:"Recover quickly after being pulled wide"}]},{id:"moving_as_pair",axis:"movement",name:"Moving as a pair",levels:{C:{master:!0,source:"draft",text:"Aware of partner, but often both end up in the same spot or leave gaps."},B:{master:!0,source:"draft",text:"Moves forward and back with partner most of the time."},A:{master:!0,source:"draft",text:"Moves as one unit and covers the middle without thinking."}},statements:[{id:"moving_as_pair_1",level:"C",text:"My partner and I move forward together.",source:"draft"},{id:"moving_as_pair_2",level:"C",text:"We move back together.",source:"draft"},{id:"moving_as_pair_3",level:"B",text:"We move sideways together and keep the gap small.",source:"draft"},{id:"moving_as_pair_4",level:"B",text:"We rarely go for the same ball.",source:"draft"},{id:"moving_as_pair_5",level:"A",text:"We move as one, even when we switch sides.",source:"draft"}],warnings:[{id:"moving_as_pair_w1",level:"C",text:"Do you and your partner end up far apart, one at the net and one at the back?",source:"draft",fix:"Stay level with my partner"},{id:"moving_as_pair_w2",level:"B",text:"Do you both go for the same ball, or both leave it?",source:"draft",fix:"Call and split the middle balls"}]},{id:"shot_choice",axis:"tactics",name:"Shot choice",levels:{D:{master:!0,source:"draft",text:"Mostly just returns the ball. Knows the scoring but not yet when to attack or defend."},C:{master:!0,source:"draft",text:"Starts to choose between safe and attacking shots. Often tries too much too soon."},B:{master:!0,source:"draft",text:"Usually picks the right shot for the situation."},A:{master:!0,source:"draft",text:"Chooses shots to set up the next one and targets weaknesses."}},statements:[{id:"shot_choice_1",level:"D",text:"When I'm in trouble, I just get the ball back safely.",source:"draft"},{id:"shot_choice_2",level:"C",text:"I look at where the opponents are before I choose.",source:"draft"},{id:"shot_choice_3",level:"C",text:"I choose placement over power.",source:"draft"},{id:"shot_choice_4",level:"B",text:"I play the safe shot when I'm out of position.",source:"draft"},{id:"shot_choice_5",level:"B",text:"I only go for winners when the ball is right.",source:"draft"},{id:"shot_choice_6",level:"A",text:"I plan a few shots ahead.",source:"draft"}],warnings:[{id:"shot_choice_w1",level:"D",text:"Do you go for winners from difficult positions?",source:"draft",fix:"Play safe from difficult positions"},{id:"shot_choice_w2",level:"C",text:"Do you pick power when placement would work better?",source:"draft",fix:"Choose placement over power"},{id:"shot_choice_w3",level:"B",text:"Do you force the attack before the ball is right?",source:"draft",fix:"Wait for the right ball to attack"}]},{id:"partner_communication",axis:"tactics",name:"Talking to your partner",levels:{C:{master:!0,source:"draft",text:"Calls 'mine' or 'leave' sometimes. Middle balls often cause confusion."},B:{master:!0,source:"draft",text:"Clear calls and agreed roles, including the middle."},A:{master:!0,source:"draft",text:"Adjusts tactics with partner during the match."}},statements:[{id:"partner_communication_1",level:"C",text:'We call "mine", "yours" and "leave".',source:"draft"},{id:"partner_communication_2",level:"C",text:"We agree who takes the middle.",source:"draft"},{id:"partner_communication_3",level:"B",text:"We agree a simple plan before we start.",source:"draft"},{id:"partner_communication_4",level:"B",text:"We talk between points, including after mistakes.",source:"draft"},{id:"partner_communication_5",level:"A",text:"We change the plan during the match.",source:"draft"}],warnings:[{id:"partner_communication_w1",level:"C",text:"Do balls go between you because nobody called?",source:"draft",fix:"Call every middle ball"},{id:"partner_communication_w2",level:"B",text:"Do you play a whole match without agreeing a plan?",source:"draft",fix:"Agree a simple plan before we start"}]},{id:"building_points",axis:"tactics",name:"Building points",levels:{B:{master:!0,source:"draft",text:"Builds pressure over several shots instead of going for winners too early."},A:{master:!0,source:"draft",text:"Changes plan when the opponent adapts."}},statements:[{id:"building_points_1",level:"B",text:"I'm patient and wait for the right ball to attack.",source:"draft"},{id:"building_points_2",level:"B",text:"I use several shots to set up a winner.",source:"draft"},{id:"building_points_3",level:"A",text:"I change pace, height and direction to create openings.",source:"draft"},{id:"building_points_4",level:"A",text:"I build pressure over several shots, instead of forcing it.",source:"draft"}],warnings:[{id:"building_points_w1",level:"B",text:"Do you lose patience and go for a winner too early?",source:"draft",fix:"Be patient before going for a winner"}]},{id:"composure",axis:"mentality",name:"Composure",levels:{D:{master:!0,source:"draft",text:"Stays calm in easy rallies, but gets frustrated after errors."},C:{master:!0,source:"draft",text:"Stays calm in relaxed games. Tight scores bring rushed shots."},B:{master:!0,source:"draft",text:"Usually calm at big points."},A:{master:!0,source:"draft",text:"Plays the same whether ahead or behind."}},statements:[{id:"composure_1",level:"D",text:"I stay calm in easy rallies.",source:"draft"},{id:"composure_2",level:"C",text:"I stay calm in friendly games, even after errors.",source:"draft"},{id:"composure_3",level:"B",text:"I stay calm at big points.",source:"draft"},{id:"composure_4",level:"B",text:"I don't rush my shots at tight scores.",source:"draft"},{id:"composure_5",level:"A",text:"I play the same whether we're ahead or behind.",source:"draft"}],warnings:[{id:"composure_w1",level:"D",text:"Do errors make you angry for a while?",source:"draft",fix:"Let go of errors quickly"},{id:"composure_w2",level:"C",text:"Do you rush your shots at tight scores?",source:"draft",fix:"Take my time at tight scores"},{id:"composure_w3",level:"B",text:"Do you play worse at big points?",source:"draft",fix:"Play my normal game at big points"}]},{id:"bouncing_back",axis:"mentality",name:"Bouncing back",levels:{C:{master:!0,source:"draft",text:"Takes a few points to settle after a mistake."},B:{master:!0,source:"draft",text:"Resets quickly after errors."},A:{master:!0,source:"draft",text:"Treats errors as information and moves on right away."}},statements:[{id:"bouncing_back_1",level:"C",text:"After a mistake, I'm over it within a few points.",source:"draft"},{id:"bouncing_back_2",level:"B",text:"I'm over it by the next point.",source:"draft"},{id:"bouncing_back_3",level:"B",text:"I use a routine to reset between points.",source:"draft"},{id:"bouncing_back_4",level:"A",text:"Mistakes don't change how I play.",source:"draft"}],warnings:[{id:"bouncing_back_w1",level:"C",text:"Does one mistake lead to several more?",source:"draft",fix:"Stop one mistake becoming several"},{id:"bouncing_back_w2",level:"B",text:"Does a bad game change how you play the next one?",source:"draft",fix:"Start each game fresh"}]},{id:"focus",axis:"mentality",name:"Focus",levels:{D:{master:!0,source:"draft",text:"Stays focused for short spells. Attention drifts after long rallies or lost points."},C:{master:!0,source:"draft",text:"Focused for most of the match, with dips when tired."}},statements:[{id:"focus_1",level:"D",text:"I stay focused in short spells.",source:"draft"},{id:"focus_2",level:"C",text:"I stay focused for most of the match.",source:"draft"},{id:"focus_3",level:"C",text:"I refocus quickly after a long rally or a lost point.",source:"draft"}],warnings:[{id:"focus_w1",level:"D",text:"Does your mind wander during points?",source:"draft",fix:"Keep my mind on the point"},{id:"focus_w2",level:"C",text:"Do you lose focus after a long rally or a lost point?",source:"draft",fix:"Refocus after long rallies or lost points"}]},{id:"groundstrokes",axis:"defence",name:"Forehand and backhand",levels:{beginner:{master:!0,source:"richard",text:"Gets the ball back over the net now and then. The walls are still confusing."},D:{master:!0,source:"draft",text:"Gets most balls back over the net from the back, mostly cross-court. Little control of height or speed."},C:{master:!0,source:"draft",text:"Keeps a steady rally from the back with a short swing. Aims low or to the middle."},B:{master:!0,source:"draft",text:"Controls height, pace and direction. Hits to the feet, through the middle or down the line on purpose."},A:{master:!0,source:"draft",text:"Uses slice, pace and angles to move opponents and set up the net. Rarely makes errors from the back."}},statements:[{id:"groundstrokes_1",level:"beginner",text:"I can get the ball over the net from the back.",source:"draft"},{id:"groundstrokes_2",level:"D",text:"I keep a simple rally going from the back.",source:"draft"},{id:"groundstrokes_3",level:"D",text:"I use a short swing, not a big tennis swing.",source:"draft"},{id:"groundstrokes_4",level:"C",text:"I keep the ball low over the net.",source:"draft"},{id:"groundstrokes_5",level:"C",text:"I aim to the middle or a side on purpose.",source:"draft"},{id:"groundstrokes_6",level:"B",text:"I control height, pace and direction.",source:"draft"},{id:"groundstrokes_7",level:"B",text:"I can hit to the feet of net players when I need to.",source:"draft"},{id:"groundstrokes_8",level:"A",text:"I use slice, pace and angles to move opponents.",source:"draft"},{id:"groundstrokes_9",level:"A",text:"I rarely make errors from the back.",source:"draft"}],warnings:[{id:"groundstrokes_w1",level:"D",text:"Do rallies end within a couple of shots because of your errors?",source:"draft",fix:"Keep the rally going longer"},{id:"groundstrokes_w2",level:"C",text:"Do you hit the ball too hard from the back and miss?",source:"draft",fix:"Hit softer and safer from the back"},{id:"groundstrokes_w3",level:"B",text:"Do your shots from the back sit up for the net players?",source:"draft",fix:"Keep my shots from the back low"}]},{id:"positioning",axis:"movement",name:"Knowing where to stand",levels:{beginner:{master:!0,source:"richard",text:"Not sure where to stand yet: back or net, left or right."},D:{master:!0,source:"draft",text:"Knows the basic spots: both back or both at the net. Covers own side and doesn't get stuck in the middle of the court."},C:{master:!0,source:"draft",text:"Moves forward and back with the play. Knows who covers the middle, and where to stand when serving and returning."},B:{master:!0,source:"draft",text:"Adjusts position to the ball and the opponents, and covers for a partner who is pulled wide."},A:{master:!0,source:"draft",text:"Reads opponents' habits and is already in position for the next ball."}},statements:[{id:"positioning_1",level:"beginner",text:"I know the basic spots: both back, or both at the net.",source:"draft"},{id:"positioning_2",level:"D",text:"I cover my own side of the court.",source:"draft"},{id:"positioning_3",level:"D",text:"I don't get stuck in the middle of the court.",source:"draft"},{id:"positioning_4",level:"C",text:"I know where to stand when serving and returning.",source:"draft"},{id:"positioning_5",level:"C",text:"I know who covers the middle.",source:"draft"},{id:"positioning_6",level:"B",text:"I adjust my position to where the ball and opponents are.",source:"draft"},{id:"positioning_7",level:"B",text:"I cover for my partner when they're pulled wide.",source:"draft"},{id:"positioning_8",level:"A",text:"I'm already in position for the next ball.",source:"draft"}],warnings:[{id:"positioning_w1",level:"D",text:"Do you end up in no man's land, the middle of the court?",source:"draft",fix:"Stay out of the middle of the court"},{id:"positioning_w2",level:"C",text:"Are you unsure where to stand when serving or returning?",source:"draft",fix:"Know where to stand when serving and returning"},{id:"positioning_w3",level:"B",text:"Do you leave gaps when your partner is pulled wide?",source:"draft",fix:"Cover the gap when my partner is pulled wide"}]},{id:"volley",axis:"attack",name:"Volley",levels:{D:{master:!0,source:"draft",text:"Gets most easy volleys back over the net. Swings too much on fast balls."},C:{master:!0,source:"draft",text:"Steady forehand and backhand volleys with a short swing. Aims deep or to the middle. Struggles with low and fast balls."},B:{master:!0,source:"draft",text:"Controls low, high and fast volleys. Changes depth and pace on purpose: deep to push back, short or at the feet to finish."},A:{master:!0,source:"draft",text:"Wins fast net exchanges. Uses block, drop and angled volleys to set up or finish, and rarely gives away an easy ball."}},statements:[{id:"volley_1",level:"D",text:"I get most easy volleys back over the net.",source:"draft"},{id:"volley_2",level:"C",text:"I volley with a short, compact swing.",source:"draft"},{id:"volley_3",level:"C",text:"I can volley forehand and backhand with control.",source:"draft"},{id:"volley_4",level:"C",text:"I aim my volleys deep or to the middle.",source:"draft"},{id:"volley_5",level:"B",text:"I can control low volleys at my feet.",source:"draft"},{id:"volley_6",level:"B",text:"I handle fast balls at the net without panicking.",source:"draft"},{id:"volley_7",level:"B",text:"I change depth on purpose: deep to push back, short to finish.",source:"draft"},{id:"volley_8",level:"A",text:"I win most fast exchanges at the net.",source:"draft"},{id:"volley_9",level:"A",text:"I use angles and drop volleys to finish points.",source:"draft"}],warnings:[{id:"volley_w1",level:"D",text:"Do easy volleys go into the net or out?",source:"draft",fix:"Get easy volleys back in"},{id:"volley_w2",level:"C",text:"Do your volleys pop up high for the opponents to smash?",source:"draft",fix:"Keep my volleys low, not popping up"},{id:"volley_w3",level:"B",text:"Do fast balls at the net beat you?",source:"draft",fix:"Handle fast balls at the net"}]},{id:"smash",axis:"attack",name:"Smash",levels:{C:{master:!0,source:"draft",text:"Smashes short, easy lobs and keeps them in. Often hits too hard, and the ball comes back off the glass."},B:{master:!0,source:"draft",text:"Picks the right lobs to smash. Places it to a corner or the feet, and gets back to the net after."},A:{master:!0,source:"draft",text:"Smashes with control from most short lobs, using flat, kick and topspin to finish or push opponents back."}},statements:[{id:"smash_1",level:"C",text:"I smash short, easy lobs and keep them in.",source:"draft"},{id:"smash_2",level:"C",text:"I don't smash every lob. I pick the short ones.",source:"draft"},{id:"smash_3",level:"B",text:"I place my smash to a corner or the feet.",source:"draft"},{id:"smash_4",level:"B",text:"I get back to the net after smashing.",source:"draft"},{id:"smash_5",level:"A",text:"I use flat, kick or topspin smashes on purpose.",source:"draft"},{id:"smash_6",level:"A",text:"My smash finishes points or pushes opponents well back.",source:"draft"}],warnings:[{id:"smash_w1",level:"C",text:"Do you smash lobs that are too deep and lose the point?",source:"draft",fix:"Only smash the short lobs"},{id:"smash_w2",level:"B",text:"Does your smash come back off the glass for an easy return?",source:"draft",fix:"Place my smash so it doesn't come back easily"}]},{id:"smash_x3",axis:"attack",name:"Smash out the side (x3)",levels:{B:{master:!1,source:"draft",text:"Tries the x3 on very short lobs and gets it out about half the time."},A:{master:!0,source:"draft",text:"Gets the x3 out over the side wall from short lobs in the middle, and knows when to try it and when not to."}},statements:[{id:"smash_x3_1",level:"B",text:"I try the x3 on very short lobs.",source:"draft"},{id:"smash_x3_2",level:"A",text:"I get the x3 out over the side fence most times I try.",source:"draft"},{id:"smash_x3_3",level:"A",text:"I know when the x3 is on, and when to play safe.",source:"draft"}],warnings:[{id:"smash_x3_w1",level:"A",text:"Do you try the x3 when it isn't on and lose the point?",source:"draft",fix:"Only try the x3 when it's on"}]},{id:"double_glass",axis:"defence",name:"Double glass",levels:{C:{master:!1,source:"draft",text:"Gets some double glass balls back, often late or with little control."},B:{master:!0,source:"draft",text:"Reads most double glass balls, waits for the ball and gets them back, often with a lob."},A:{master:!0,source:"draft",text:"Handles double glass from both corners, and chooses a lob or a low ball depending on where opponents are."}},statements:[{id:"double_glass_1",level:"C",text:"I get some double glass balls back.",source:"draft"},{id:"double_glass_2",level:"B",text:"I can tell which wall the ball will hit first.",source:"draft"},{id:"double_glass_3",level:"B",text:"I wait for the ball and get most double glass balls back, often with a lob.",source:"draft"},{id:"double_glass_4",level:"A",text:"I choose a lob or a low ball depending on where the opponents are.",source:"draft"}],warnings:[{id:"double_glass_w1",level:"C",text:"Do double glass balls beat you?",source:"draft",fix:"Get double glass balls back"},{id:"double_glass_w2",level:"B",text:"Do you misjudge which wall the ball will hit first?",source:"draft",fix:"Read which wall the ball will hit first"}]},{id:"smash_defence",axis:"defence",name:"Defending a smash",levels:{C:{master:!1,source:"draft",text:"Gets some smashes back when they come off the glass. Often gives up on hard ones."},B:{master:!0,source:"draft",text:"Reads where a smash will bounce and gets most back, including off the back glass."},A:{master:!0,source:"draft",text:"Gets back x3 and x4 smashes by running round or out of court where allowed, and turns some into counter-attacks."}},statements:[{id:"smash_defence_1",level:"C",text:"I get some smashes back when they come off the glass.",source:"draft"},{id:"smash_defence_2",level:"B",text:"I read where a smash will bounce.",source:"draft"},{id:"smash_defence_3",level:"B",text:"I get most smashes back, including off the back glass.",source:"draft"},{id:"smash_defence_4",level:"A",text:"I chase x3 and x4 smashes where the court allows.",source:"draft"},{id:"smash_defence_5",level:"A",text:"I turn some smash defences into counter-attacks.",source:"draft"}],warnings:[{id:"smash_defence_w1",level:"C",text:"Do you give up on smashes you could reach?",source:"draft",fix:"Chase smashes I can reach"},{id:"smash_defence_w2",level:"B",text:"Do you misread where a smash will bounce?",source:"draft",fix:"Read where smashes will bounce"}]},{id:"chiquita",axis:"defence",name:"Chiquita",levels:{C:{master:!0,source:"draft",text:"Plays a soft, low ball to the net players' feet some of the time, then moves up."},B:{master:!0,source:"draft",text:"Uses the chiquita on purpose to make opponents volley up, and moves up together with partner."},A:{master:!0,source:"draft",text:"Disguises the chiquita and mixes it with lobs and passing shots so opponents can't predict it."}},statements:[{id:"chiquita_1",level:"C",text:"I can play a soft, low ball to the net players' feet.",source:"draft"},{id:"chiquita_2",level:"C",text:"After a chiquita, I move up.",source:"draft"},{id:"chiquita_3",level:"B",text:"I use it on purpose to make opponents volley up.",source:"draft"},{id:"chiquita_4",level:"B",text:"My partner and I move up together after it.",source:"draft"},{id:"chiquita_5",level:"A",text:"I disguise it and mix it with lobs and passing shots.",source:"draft"}],warnings:[{id:"chiquita_w1",level:"C",text:"Does your soft ball sit up and get attacked?",source:"draft",fix:"Keep my chiquita low"},{id:"chiquita_w2",level:"B",text:"After a chiquita, do you stay at the back instead of moving up?",source:"draft",fix:"Move up after a chiquita"}]},{id:"block_volley",axis:"attack",name:"Block volley",levels:{C:{master:!0,source:"draft",text:"Can block a fast ball back at the net, but it often sits up for the opponents."},B:{master:!0,source:"draft",text:"Blocks fast balls low and deep with a short, firm racket."},A:{master:!0,source:"draft",text:"Uses the block to change pace, landing it short or at the feet on purpose."}},statements:[{id:"block_volley_1",level:"C",text:"I can block a fast ball back at the net.",source:"draft"},{id:"block_volley_2",level:"B",text:"My blocks land low or deep, not sitting up.",source:"draft"},{id:"block_volley_3",level:"A",text:"I use the block to change pace and land it at their feet.",source:"draft"}],warnings:[{id:"block_volley_w1",level:"C",text:"Do your blocks sit up for the opponents to attack?",source:"draft",fix:"Keep my blocks low"}]},{id:"drop_volley",axis:"attack",name:"Drop volley",levels:{B:{master:!0,source:"draft",text:"Tries the drop volley when opponents are deep. It works some of the time."},A:{master:!0,source:"draft",text:"Disguises the drop volley and uses it at the right moment to win the point."}},statements:[{id:"drop_volley_1",level:"B",text:"I try a drop volley when both opponents are deep.",source:"draft"},{id:"drop_volley_2",level:"B",text:"My drop volley lands short and doesn't sit up.",source:"draft"},{id:"drop_volley_3",level:"A",text:"I disguise it so opponents don't see it coming.",source:"draft"}],warnings:[{id:"drop_volley_w1",level:"B",text:"Does your drop volley sit up or go into the net?",source:"draft",fix:"Land my drop volley short and low"}]},{id:"gancho",axis:"attack",name:"Hook",levels:{B:{master:!0,source:"draft",text:"Can play a quick hook at the net on high balls, mostly to keep the ball in play."},A:{master:!0,source:"draft",text:"Uses the hook to attack fast high balls at the net with control and placement."}},statements:[{id:"gancho_1",level:"B",text:"I can hit a quick hook on a high ball at the net.",source:"draft"},{id:"gancho_2",level:"A",text:"I use the hook to attack, with control and placement.",source:"draft"}],warnings:[{id:"gancho_w1",level:"B",text:"Do you miss high balls at the net because you can't turn in time?",source:"draft",fix:"Turn in time on high balls at the net"}]},{id:"rulo",axis:"attack",name:"Topspin smash",levels:{A:{master:!0,source:"draft",text:"Hits a topspin smash that kicks up off the back glass and pushes opponents back."}},statements:[{id:"rulo_1",level:"A",text:"I can hit a topspin smash that kicks up off the back glass.",source:"draft"},{id:"rulo_2",level:"A",text:"I use it on purpose to push opponents back.",source:"draft"}],warnings:[{id:"rulo_w1",level:"A",text:"Does your topspin smash sit up off the glass?",source:"draft",fix:"Keep my topspin smash low off the glass"}]},{id:"smash_x4",axis:"attack",name:"Smash out the back (x4)",levels:{A:{master:!0,source:"draft",text:"Can hit the x4 from very short balls near the net, and knows when it's on."}},statements:[{id:"smash_x4_1",level:"A",text:"I can hit an x4 out over the back on short, high balls.",source:"draft"},{id:"smash_x4_2",level:"A",text:"I know when the x4 is on, and when to play safe.",source:"draft"}],warnings:[{id:"smash_x4_w1",level:"A",text:"Do you try the x4 when it isn't on and lose the point?",source:"draft",fix:"Only try the x4 when it's on"}]},{id:"drop_shot",axis:"attack",name:"Drop shot",levels:{B:{master:!0,source:"draft",text:"Plays a drop shot when opponents are deep. Sometimes it sits up."},A:{master:!0,source:"draft",text:"Disguises the drop shot and lands it short and low at the right moment."}},statements:[{id:"drop_shot_1",level:"B",text:"I play a drop shot when opponents are deep.",source:"draft"},{id:"drop_shot_2",level:"B",text:"My drop shot lands short and low, not sitting up.",source:"draft"},{id:"drop_shot_3",level:"A",text:"I disguise it and pick the right moment.",source:"draft"}],warnings:[{id:"drop_shot_w1",level:"B",text:"Does your drop shot sit up or go into the net?",source:"draft",fix:"Land my drop shot short and low"}]},{id:"contrapared",axis:"defence",name:"Back wall rescue",levels:{B:{master:!0,source:"draft",text:"Can get the ball back with a back wall boast in emergencies."},A:{master:!0,source:"draft",text:"Uses the back wall boast as a planned option when there's no other way forwards."}},statements:[{id:"contrapared_1",level:"B",text:"In an emergency, I can hit the ball into my own back wall to get it over.",source:"draft"},{id:"contrapared_2",level:"A",text:"I use it as a planned option when there's no way to hit forwards.",source:"draft"}],warnings:[{id:"contrapared_w1",level:"B",text:"Do you lose the point when you can't hit the ball forwards?",source:"draft",fix:"Use the back wall when I can't hit forwards"}]},{id:"attacking_lob",axis:"defence",name:"Attacking lob",levels:{C:{master:!0,source:"draft",text:"Tries a lower, faster lob when opponents are very close to the net."},B:{master:!0,source:"draft",text:"Uses the attacking lob on purpose to get behind net players and then moves up."},A:{master:!0,source:"draft",text:"Disguises the attacking lob, so opponents can't move back early."}},statements:[{id:"attacking_lob_1",level:"C",text:"I try a lower, faster lob when opponents are close to the net.",source:"d
