, handles pressure."},{id:"A",order:4,name:"A",assessable:!0,description:"Complete player: tactics, variety, strong play against good opponents."},{id:"Pro",order:5,name:"Pro",assessable:!1,description:"Professional level. The top benchmark, not an assessment target for most players."}],zh=[{id:"serve",axis:"attack",name:"Serve",levels:{beginner:{master:!0,source:"richard",text:"Learning the serve. Often faults. Just trying to get it in the box."},D:{master:!0,source:"richard",text:"In the right box about 7 or 8 out of 10. Soft and floaty. Not deep, no slice, no aiming at the side glass. The goal is just getting it in."},C:{master:!0,source:"draft",text:"Usually in, with some depth. Can aim to a side or the body. Less reliable under pressure."},B:{master:!0,source:"draft",text:"Reliable first serve with pace or slice. Placement is chosen on purpose and holds up when the score is tight."},A:{master:!0,source:"draft",text:"Varies pace, spin and direction to set up the next shot. Targets weaknesses on purpose."}}},{id:"overhead_basic",axis:"attack",name:"Basic overhead",levels:{D:{master:!0,source:"draft",text:"Avoids lobs or misjudges them. Pushes the ball back rather than hitting through it."},C:{master:!0,source:"draft",text:"Gets under most lobs and hits a controlled overhead back, usually deep."}}},{id:"bandeja",axis:"attack",name:"Bandeja",levels:{C:{master:!0,source:"draft",text:"Can hit a bandeja in a friendly game to hold the net. Depth and direction vary."},B:{master:!0,source:"draft",text:"Reliable bandeja that keeps opponents back and holds the net, even when rushed."},A:{master:!0,source:"draft",text:"Chooses between attacking and defensive bandeja depending on the situation."}}},{id:"vibora",axis:"attack",name:"Víbora",levels:{B:{master:!0,source:"draft",text:"Can use a víbora to add pace and angle when the ball is right for it."},A:{master:!0,source:"draft",text:"Chooses víbora versus bandeja on purpose and places it under pressure."}}},{id:"bajada",axis:"attack",name:"Bajada",levels:{B:{master:!0,source:"draft",text:"Can attack a ball coming off the back glass with control."},A:{master:!0,source:"draft",text:"Uses the bajada to finish points with placement and power."}}},{id:"return_of_serve",axis:"defence",name:"Return of serve",levels:{beginner:{master:!0,source:"richard",text:"Gets some serves back, but often misses or hits it out."},D:{master:!0,source:"richard",text:"Gets the ball over the net. Soft and floaty. Backhand is weaker."},C:{master:!0,source:"draft",text:"Usually a safe, deep return. Backhand is steadier. Starts choosing direction."},B:{master:!0,source:"draft",text:"Reliable return under pressure. Can choose a low, a lob or an attacking return."},A:{master:!0,source:"draft",text:"Returns on purpose to win the net and hurts weak serves."}}},{id:"defensive_lob",axis:"defence",name:"Defensive lob",levels:{D:{master:!0,source:"draft",text:"Can get the lob over the net sometimes, but it's often too low or too short. Only works in an easy rally with plenty of time."},C:{master:!0,source:"draft",text:"Usually gets a lob over in a friendly game when there is time. Height and depth are hit or miss. Falls apart when rushed or off the glass."},B:{master:!0,source:"draft",text:"Usually lands a deep lob in matches, even when rushed. Pushes opponents back and lets you win the net. Mostly holds when the score is tight."},A:{master:!0,source:"draft",text:"Chooses the lob on purpose: side, height, depth. Works from awkward positions and at big points against strong opponents."}}},{id:"back_glass_return",axis:"defence",name:"Back-glass return",levels:{D:{master:!0,source:"richard",text:"Rarely plays off the glass, and often doesn't succeed when it does."},C:{master:!0,source:"draft",text:"Can return most slow or medium balls off the back glass. Struggles with fast or awkward rebounds."},B:{master:!0,source:"draft",text:"Reads rebounds early and returns most balls off the back glass with control."},A:{master:!0,source:"draft",text:"Uses the glass to buy time and turn defence into attack."}}},{id:"side_glass_return",axis:"defence",name:"Side-glass return",levels:{C:{master:!0,source:"draft",text:"Can return simple balls off the side glass. Often late on faster ones."},B:{master:!0,source:"draft",text:"Reads side-glass angles and returns with control most of the time."},A:{master:!0,source:"draft",text:"Handles double-glass balls and awkward angles under pressure."}}},{id:"ready_position",axis:"movement",name:"Ready position and split step",levels:{D:{master:!0,source:"draft",text:"Reacts late. Often flat-footed when the ball arrives."},C:{master:!0,source:"draft",text:"Usually ready before the opponent hits. Split step is inconsistent."}}},{id:"net_play",axis:"movement",name:"Net play",levels:{D:{master:!0,source:"richard",text:"Rarely takes the net. Stays at the back after serving and returning. When at the net, volleys are a block that often goes into the net or too high."},C:{master:!0,source:"draft",text:"Takes the net when the chance is clear and holds it with steady volleys."},B:{master:!0,source:"draft",text:"Wins and holds the net on purpose. Volleys have direction, attacking or defensive as needed."},A:{master:!0,source:"draft",text:"Dominates the net. Redirects, finishes and recovers position quickly."}}},{id:"recovery",axis:"movement",name:"Recovery after a shot",levels:{C:{master:!0,source:"draft",text:"Sometimes gets back into position after a shot. Often caught out of place."},B:{master:!0,source:"draft",text:"Usually recovers to a good position before the next ball."},A:{master:!0,source:"draft",text:"Recovers automatically, even after being pulled wide."}}},{id:"moving_as_pair",axis:"movement",name:"Moving as a pair",levels:{C:{master:!0,source:"draft",text:"Aware of partner, but often both end up in the same spot or leave gaps."},B:{master:!0,source:"draft",text:"Moves forward and back with partner most of the time."},A:{master:!0,source:"draft",text:"Moves as one unit and covers the middle without thinking."}}},{id:"shot_choice",axis:"tactics",name:"Choosing the shot",levels:{D:{master:!0,source:"draft",text:"Mostly just returns the ball. Knows the scoring but not yet when to attack or defend."},C:{master:!0,source:"draft",text:"Starts to choose between safe and attacking shots. Often tries too much too soon."},B:{master:!0,source:"draft",text:"Usually picks the right shot for the situation."},A:{master:!0,source:"draft",text:"Chooses shots to set up the next one and targets weaknesses."}}},{id:"partner_communication",axis:"tactics",name:"Partner communication",levels:{C:{master:!0,source:"draft",text:"Calls 'mine' or 'leave' sometimes. Middle balls often cause confusion."},B:{master:!0,source:"draft",text:"Clear calls and agreed roles, including the middle."},A:{master:!0,source:"draft",text:"Adjusts tactics with partner during the match."}}},{id:"building_points",axis:"tactics",name:"Building a point",levels:{B:{master:!0,source:"draft",text:"Builds pressure over several shots instead of going for winners too early."},A:{master:!0,source:"draft",text:"Changes plan when the opponent adapts."}}},{id:"composure",axis:"mentality",name:"Composure",levels:{D:{master:!0,source:"draft",text:"Gets frustrated after errors. Focus drops during long rallies."},C:{master:!0,source:"draft",text:"Stays calm in relaxed games. Tight scores bring rushed shots."},B:{master:!0,source:"draft",text:"Usually calm at big points."},A:{master:!0,source:"draft",text:"Plays the same whether ahead or behind."}}},{id:"bouncing_back",axis:"mentality",name:"Bouncing back after mistakes",levels:{C:{master:!0,source:"draft",text:"Takes a few points to settle after a mistake."},B:{master:!0,source:"draft",text:"Resets quickly after errors."},A:{master:!0,source:"draft",text:"Treats errors as information and moves on right away."}}},{id:"focus",axis:"mentality",name:"Focus",levels:{D:{master:!0,source:"draft",text:"Attention drifts, especially after a long rally or a lost point."},C:{master:!0,source:"draft",text:"Focused for most of the match, with dips when tired."}}},{id:"groundstrokes",axis:"defence",name:"Forehand and backhand",levels:{beginner:{master:!0,source:"richard",text:"Gets the ball back over the net now and then. The walls are still confusing."},D:{master:!0,source:"draft",text:"Gets most balls back over the net from the back, mostly cross-court. Little control of height or speed."},C:{master:!0,source:"draft",text:"Keeps a steady rally from the back with a short swing. Aims low or to the middle."},B:{master:!0,source:"draft",text:"Controls height, pace and direction. Hits to the feet, through the middle or down the line on purpose."},A:{master:!0,source:"draft",text:"Uses slice, pace and angles to move opponents and set up the net. Rarely makes errors from the back."}}},{id:"positioning",axis:"movement",name:"Knowing where to stand",levels:{beginner:{master:!0,source:"richard",text:"Not sure where to stand yet: back or net, left or right."},D:{master:!0,source:"draft",text:"Knows the basic spots: both back or both at the net. Covers own side and doesn't get stuck in the middle of the court."},C:{master:!0,source:"draft",text:"Moves forward and back with the play. Knows who covers the middle, and where to stand when serving and returning."},B:{master:!0,source:"draft",text:"Adjusts position to the ball and the opponents, and covers for a partner who is pulled wide."},A:{master:!0,source:"draft",text:"Reads opponents' habits and is already in position for the next ball."}}},{id:"volley",axis:"attack",name:"Volley",levels:{D:{master:!0,source:"draft",text:"Gets most easy volleys back over the net. Swings too much on fast balls."},C:{master:!0,source:"draft",text:"Steady forehand and backhand volleys with a short swing. Aims deep or to the middle. Struggles with low and fast balls."},B:{master:!0,source:"draft",text:"Controls low, high and fast volleys. Changes depth and pace on purpose: deep to push back, short or at the feet to finish."},A:{master:!0,source:"draft",text:"Wins fast net exchanges. Uses block, drop and angled volleys to set up or finish, and rarely gives away an easy ball."}}},{id:"smash",axis:"attack",name:"Smash",levels:{C:{master:!0,source:"draft",text:"Smashes short, easy lobs and keeps them in. Often hits too hard, and the ball comes back off the glass."},B:{master:!0,source:"draft",text:"Picks the right lobs to smash. Places it to a corner or the feet, and gets back to the net after."},A:{master:!0,source:"draft",text:"Smashes with control from most short lobs, using flat, kick and topspin to finish or push opponents back."}}},{id:"smash_x3",axis:"attack",name:"Smash por tres",levels:{B:{master:!1,source:"draft",text:"Tries the x3 on very short lobs and gets it out about half the time."},A:{master:!0,source:"draft",text:"Gets the x3 out over the side wall from short lobs in the middle, and knows when to try it and when not to."}}},{id:"double_glass",axis:"defence",name:"Double glass",levels:{C:{master:!1,source:"draft",text:"Gets some double glass balls back, often late or with little control."},B:{master:!0,source:"draft",text:"Reads most double glass balls, waits for the ball and gets them back, often with a lob."},A:{master:!0,source:"draft",text:"Handles double glass from both corners, and chooses a lob or a low ball depending on where opponents are."}}},{id:"smash_defence",axis:"defence",name:"Defending a smash",levels:{C:{master:!1,source:"draft",text:"Gets some smashes back when they come off the glass. Often gives up on hard ones."},B:{master:!0,source:"draft",text:"Reads where a smash will bounce and gets most back, including off the back glass."},A:{master:!0,source:"draft",text:"Gets back x3 and x4 smashes by running round or out of court where allowed, and turns some into counter-attacks."}}},{id:"chiquita",axis:"defence",name:"Chiquita",levels:{C:{master:!0,source:"draft",text:"Plays a soft, low ball to the net players' feet some of the time, then moves up."},B:{master:!0,source:"draft",text:"Uses the chiquita on purpose to make opponents volley up, and moves up together with partner."},A:{master:!0,source:"draft",text:"Disguises the chiquita and mixes it with lobs and passing shots so opponents can't predict it."}}}],ei={axes:Yh,levels:Bh,skills:zh},Fh=[{id:"attacking",name:"Attacking shots"},{id:"defensive",name:"Defensive shots"},{id:"transition",name:"Transition shots",note:"From defence towards attack"},{id:"specialist",name:"Specialist shots",note:"Emergency or pro-level. Not checked."},{id:"movement",name:"Movement"},{id:"tactics",name:"Tactics and teamwork"},{id:"mentality",name:"Mentality"}],Ih=[{id:"serve",name:"Serve",aka:"Saque",group:"attacking",area:"attack",checked:!0,firstLevel:"beginner",what:"Underarm serve: bounce the ball behind the line and hit it at or below waist height, diagonally into the box.",when:"Starts every point. At first, just get it in. Later, use depth, spin and aim.",source:"draft"},{id:"volley",name:"Volley",aka:"Volea",group:"attacking",area:"attack",checked:!0,firstLevel:"D",what:"Hitting the ball before it bounces, usually at the net, forehand or backhand.",when:"When you're at the net and the ball comes to you in the air.",source:"draft"},{id:"block_volley",name:"Block volley",aka:"",group:"attacking",area:"attack",checked:!1,firstLevel:"C",what:"A short, firm volley with almost no swing that uses the ball's own pace.",when:"Against fast balls at the net, or to get the ball low at their feet.",source:"draft"},{id:"drop_volley",name:"Drop volley",aka:"Dejada de volea",group:"attacking",area:"attack",checked:!1,firstLevel:"B",what:"A soft volley that drops just over the net.",when:"When both opponents are deep at the back.",source:"draft"},{id:"overhead_basic",name:"Basic overhead",aka:"",group:"attacking",area:"attack",checked:!0,firstLevel:"D",what:"Hitting a high ball above your head with control rather than power.",when:"When a lob is short enough to reach without running back.",source:"draft"},{id:"bandeja",name:"Bandeja",aka:"",group:"attacking",area:"attack",checked:!0,firstLevel:"C",what:"A sliced overhead hit at about head height, flatter and slower than a smash. It keeps you at the net.",when:"Against lobs you can't safely smash. The most common overhead in padel.",source:"draft"},{id:"vibora",name:"Víbora",aka:"",group:"attacking",area:"attack",checked:!0,firstLevel:"B",what:"A faster, more aggressive bandeja with side spin, aimed low into the side glass.",when:"Against medium lobs when you want to put more pressure on.",source:"draft"},{id:"smash",name:"Smash",aka:"Remate",group:"attacking",area:"attack",checked:!0,firstLevel:"C",what:"A full, hard overhead hit downwards.",when:"When a lob is short and you have time to set up.",source:"draft"},{id:"gancho",name:"Gancho",aka:"Hook",group:"attacking",area:"attack",checked:!1,firstLevel:"B",what:"A quick overhead hit in front of the body from the side, near the net, without turning fully sideways.",when:"When a ball comes high and fast to you at the net with no time to set up.",source:"draft"},{id:"rulo",name:"Rulo",aka:"Topspin smash",group:"attacking",area:"attack",checked:!1,firstLevel:"A",what:"A smash with heavy topspin that kicks up off the back glass.",when:"To push opponents back or force a weak reply.",source:"draft"},{id:"smash_x3",name:"Smash por tres",aka:"x3",group:"attacking",area:"attack",checked:!0,firstLevel:"A",what:"A smash hit so hard it bounces out over the side wall.",when:"Against a short lob in the middle of the court when you can finish the point.",source:"draft"},{id:"smash_x4",name:"Smash por cuatro",aka:"x4",group:"attacking",area:"attack",checked:!1,firstLevel:"A",what:"A smash that bounces back over the net, or out through the side door, on your side.",when:"Same as x3 but from the side of the court. Advanced.",source:"draft"},{id:"bajada",name:"Bajada",aka:"",group:"attacking",area:"attack",checked:!0,firstLevel:"B",what:"An
